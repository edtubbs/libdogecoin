name: SPV historical resume

on:
  workflow_dispatch:
    inputs:
      address:
        description: Dogecoin address for filtered block scan
        required: true
        default: DFhe3jyi2rLtmCHz6bvTiG46eoAoBQgggQ
      checkpoint_choice:
        description: Checkpoint menu choice used on a fresh headers DB
        required: true
        default: "24"

permissions:
  contents: read

jobs:
  spv-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore SPV state cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            build/main_headers.db
            build/main_wallet.db
          key: spv-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            spv-state-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev

      - name: Build spvnode
        run: |
          cmake -S . -B build -DWITH_NET=ON
          cmake --build build --target spvnode -j"$(nproc)"

      - name: Run bounded SPV sync chunk
        id: run-spv
        env:
          ADDRESS: ${{ github.event.inputs.address }}
          CHECKPOINT_CHOICE: ${{ github.event.inputs.checkpoint_choice }}
        run: |
          set +e
          cd build
          # first two newlines accept wallet/headers load prompts on reruns; checkpoint choice is used on fresh state
          printf '\n\n%s\n' "$CHECKPOINT_CHOICE" | timeout 50m ./spvnode -c -x -a "$ADDRESS" -g -q -p scan > spv-run.log 2>&1
          rc=$?
          set -e
          # timeout(1) exits with 124 when the bounded chunk duration is reached
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            tail -n 200 spv-run.log
            exit "$rc"
          fi
          python - <<'PY'
          from pathlib import Path
          import struct
          SPV_HEADERS_FILE_HDR_LEN = 8
          SPV_HEADERS_FILE_REC_LEN = 148
          SPV_HEADERS_HEIGHT_OFFSET = 32
          p=Path('main_headers.db')
          if not p.exists() or p.stat().st_size < SPV_HEADERS_FILE_HDR_LEN + SPV_HEADERS_FILE_REC_LEN:
              print('tip_height=unknown')
          else:
              n=(p.stat().st_size - SPV_HEADERS_FILE_HDR_LEN)//SPV_HEADERS_FILE_REC_LEN
              with p.open('rb') as f:
                  f.seek(SPV_HEADERS_FILE_HDR_LEN + (n-1)*SPV_HEADERS_FILE_REC_LEN + SPV_HEADERS_HEIGHT_OFFSET)
                  h=struct.unpack('<I',f.read(4))[0]
              print(f'tip_height={h}')
          PY

      - name: Upload SPV run log
        uses: actions/upload-artifact@v4
        with:
          name: spv-resume-log-${{ github.run_id }}
          path: build/spv-run.log
          if-no-files-found: error

      - name: Save updated SPV state cache
        uses: actions/cache/save@v4
        with:
          path: |
            build/main_headers.db
            build/main_wallet.db
          key: spv-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
